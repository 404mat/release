[workspace]
resolver = "2"
members = [
  "crates/release-core",
  "crates/release-cli",
  "crates/release-tui",
  "crates/release",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/404mat/release"
authors = ["Leo Lamprecht <leo@lichtbit.com>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
semver = "1"
toml = "0.8"
ureq = { version = "2", features = ["json"] }
url = "2"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"

release-core = { path = "crates/release-core" }
release-cli = { path = "crates/release-cli" }
release-tui = { path = "crates/release-tui" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
